
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product | STICKS N CART</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">STICKS N CART.</a>
        <a href="index.html" class="back-link">← BACK TO STORE</a>
    </header>

    <main class="product-page">
        <div class="product-detail-image">
            <span id="productNumber">01</span>
        </div>

        <div class="product-detail-info">
            <p class="product-label">STICKS N CART COLLECTION</p>
            <h1 id="productName">Everyday Essential</h1>
            <h2 id="productPrice">₹499</h2>

            <p id="productDescription">
                Discover something useful.
            </p>

            <div class="detail-quantity">
                <button id="decreaseQty">−</button>
                <span id="quantity">1</span>
                <button id="increaseQty">+</button>
            </div>

            <button class="add-button detail-add" id="detailAdd">
                ADD TO CART +
            </button>

            <p class="product-note">
                Simple products. Everyday convenience.
            </p>
        </div>
    </main>

    <script src="product.js"></script>
</body>
</html>
